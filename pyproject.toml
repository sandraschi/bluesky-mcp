[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluesky-mcp"
version = "0.1.1"
description = "Bluesky (AT Proto) MCP bridge with human-approved outbox for fleet-PR drafts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pyright>=1.1.390",
    "ruff>=0.16.0,<0.17",
]

[project.scripts]
bluesky-mcp = "bluesky_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bluesky_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=bluesky_mcp --cov-report=term-missing --cov-fail-under=60"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
]
